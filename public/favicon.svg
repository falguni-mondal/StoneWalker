<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3626"/>
      <stop offset="1" stop-color="#211812"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="60%">
      <stop offset="0" stop-color="#e8742a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8742a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8a583"/>
      <stop offset="1" stop-color="#7d6c56"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Setting sun behind the walker -->
  <circle cx="256" cy="372" r="128" fill="#e8742a" opacity="0.9"/>

  <!-- Ground -->
  <path d="M0 424 Q256 400 512 424 V512 H0 Z" fill="#1a120e"/>

  <!-- Legs -->
  <g fill="none" stroke="#5e4a38" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M186 312 L142 366 L164 424"/>
    <path d="M326 312 L370 366 L348 424"/>
  </g>
  <ellipse cx="160" cy="430" rx="40" ry="14" fill="#3b2d22"/>
  <ellipse cx="352" cy="430" rx="40" ry="14" fill="#3b2d22"/>

  <!-- Main stone body -->
  <rect x="120" y="190" width="272" height="136" rx="30" fill="url(#stone)"/>
  <rect x="112" y="180" width="288" height="22" rx="11" fill="#f7f0df"/>
  <path d="M120 262 H392" stroke="#5e4a38" stroke-width="6" opacity="0.45"/>
  <path d="M256 202 V262" stroke="#5e4a38" stroke-width="6" opacity="0.45"/>

  <!-- Glowing windows -->
  <rect x="164" y="222" width="44" height="46" rx="12" fill="#ffb347"/>
  <rect x="304" y="222" width="44" height="46" rx="12" fill="#ffb347"/>

  <!-- Tower hut and roof -->
  <rect x="202" y="118" width="108" height="68" rx="14" fill="#8c7a60"/>
  <polygon points="184,126 256,62 328,126" fill="#b5532f"/>
  <rect x="236" y="140" width="40" height="46" rx="12" fill="#3b2d22"/>

  <!-- Banner -->
  <path d="M256 66 V26" stroke="#f7f0df" stroke-width="8" stroke-linecap="round"/>
  <path d="M260 28 L308 42 L260 58 Z" fill="#e2b04a"/>
</svg>
